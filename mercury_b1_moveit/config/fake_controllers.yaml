controller_list:
  - name: fake_left_arm_controller
    type: $(arg fake_execution_type)
    joints:
      - L1_joint
      - L2_joint
      - L3_joint
      - L4_joint
      - L5_joint
      - L6_joint
      - L7_joint
  - name: fake_right_arm_controller
    type: $(arg fake_execution_type)
    joints:
      - R1_joint
      - R2_joint
      - R3_joint
      - R4_joint
      - R5_joint
      - R6_joint
      - R7_joint
initial:  # Define initial robot poses per group
  - group: left_arm
    pose: init_pose
  - group: right_arm
    pose: init_pose